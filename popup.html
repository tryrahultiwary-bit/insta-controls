<!doctype html>
<meta charset="utf-8">
<title>Insta Controls</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --text: #1d1d1f; --sub: #86868b; --sep: rgba(60,60,67,.12);
    --fill: rgba(118,118,128,.12); --green: #34c759; --seg-on: #fff;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #2c2c2e; --text: #f5f5f7; --sub: #98989d; --sep: rgba(84,84,88,.5);
      --fill: rgba(118,118,128,.24); --green: #30d158; --seg-on: #636366; --shadow: none;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 320px; background: var(--bg); color: var(--text); padding: 16px;
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 14px; }

  .hero { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .hero img { width: 44px; height: 44px; flex: none; }
  .meta { flex: 1; min-width: 0; }
  .state { font: 600 15px/1.2 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.2px; }
  .host { color: var(--sub); font-size: 12px; margin-top: 2px; }

  .switch { appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative;
    cursor: pointer; transition: background .25s; flex: none; outline: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16);
    transition: transform .3s cubic-bezier(.3,1.3,.6,1); }
  .switch:checked { background: var(--green); }
  .switch:checked::after { transform: translateX(20px); }
  .switch:focus-visible { box-shadow: 0 0 0 3px rgba(0,122,255,.5); }

  .label { color: var(--sub); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; margin: 4px 12px 6px; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 14px; position: relative; cursor: pointer; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 46px; right: 0; border-top: .5px solid var(--sep); }
  .dot { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex: none; }
  .dot svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .name { flex: 1; }
  .name small { display: block; color: var(--sub); font-size: 11px; }

  .seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin: 0 0 14px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--text); font: 500 13px -apple-system, sans-serif;
    padding: 6px 0; border-radius: 7px; cursor: pointer; transition: background .2s, box-shadow .2s; }
  .seg button.on { background: var(--seg-on); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); }

  .keys { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 8px; padding: 12px 14px; font-size: 12px; align-items: center; }
  kbd { font: 500 11px -apple-system, sans-serif; background: var(--fill); border-radius: 5px; padding: 2px 6px; text-align: center; white-space: nowrap; }
  .keys span { color: var(--sub); }
</style>

<label class="card hero">
  <img src="icons/icon128.png" alt="">
  <div class="meta">
    <div class="state">Insta Controls</div>
    <div class="host">Control bar on hover</div>
  </div>
  <input type="checkbox" class="switch" data-k="bar" aria-label="Show control bar">
</label>

<div class="label">Default speed</div>
<div class="seg" id="speed">
  <button data-s="0.5">0.5×</button><button data-s="1">1×</button><button data-s="1.25">1.25×</button><button data-s="1.5">1.5×</button><button data-s="2">2×</button>
</div>

<div class="label">Playback</div>
<div class="card">
  <label class="row"><span class="dot" style="background:#ff9500"><svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/></svg></span>
    <span class="name">Loop videos</span><input type="checkbox" class="switch" data-k="loop"></label>
  <label class="row"><span class="dot" style="background:#af52de"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6M6 4l6 6 6-6"/></svg></span>
    <span class="name">Auto-scroll<small>Next Reel when one ends</small></span><input type="checkbox" class="switch" data-k="autoScroll"></label>
  <label class="row"><span class="dot" style="background:#007aff"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM15.5 9a4 4 0 0 1 0 6"/></svg></span>
    <span class="name">Remember choices<small>Volume and speed carry over</small></span><input type="checkbox" class="switch" data-k="remember"></label>
  <label class="row"><span class="dot" style="background:#ff2d55"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></span>
    <span class="name">Click video to pause<small>Instead of click-to-mute</small></span><input type="checkbox" class="switch" data-k="clickPause"></label>
  <label class="row"><span class="dot" style="background:#8e8e93"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg></span>
    <span class="name">Keyboard shortcuts</span><input type="checkbox" class="switch" data-k="keys"></label>
</div>

<div class="label">Shortcuts</div>
<div class="card keys">
  <kbd>Space / K</kbd><span>Play</span><kbd>M</kbd><span>Mute</span>
  <kbd>J / L</kbd><span>−/+10 s</span><kbd>← / →</kbd><span>−/+5 s</span>
  <kbd>↑ / ↓</kbd><span>Volume</span><kbd>&lt; / &gt;</kbd><span>Speed</span>
  <kbd>N / ⇧↓</kbd><span>Next</span><kbd>P / ⇧↑</kbd><span>Previous</span>
  <kbd>F</kbd><span>Fullscreen</span><kbd>I</kbd><span>Pop out</span>
  <kbd>0–9</kbd><span>Jump to %</span><kbd>, / .</kbd><span>Frame step</span>
  <kbd>T</kbd><span>Copy link + transcript</span>
</div>
<script src="popup.js"></script>
